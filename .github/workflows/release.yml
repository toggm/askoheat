name: "Release"

on:
  release:
    types:
      - "published"

jobs:
  release:
    name: "Release"
    runs-on: "ubuntu-latest"
    permissions:
      contents: write
      discussions: write
    steps:
      - name: "Checkout the repository"
        uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1

      - name: Verify release version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          TAG_VERSION="${RELEASE_TAG#v}"
          MANIFEST_VERSION=$(jq -r '.version // empty' \
            custom_components/my_integration/manifest.json)

          echo "Release tag version: $TAG_VERSION"
          echo "Manifest version:    $MANIFEST_VERSION"

          if [ "$TAG_VERSION" != "$MANIFEST_VERSION" ]; then
            echo "::error::Release tag ($TAG_VERSION) does not match manifest version ($MANIFEST_VERSION)"
            exit 1
          fi

    echo "Release tag and manifest version match."

      - name: "ZIP the integration directory"
        shell: "bash"
        run: |
          cd "${{ github.workspace }}/custom_components/askoheat"
          zip askoheat.zip -r ./

      - name: "Upload the ZIP file to the release"
        uses: "softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64" # v3.0.3
        with:
          files: ${{ github.workspace }}/custom_components/askoheat/askoheat.zip
